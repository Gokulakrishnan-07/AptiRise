<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AptiRise Admin Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Admin Navigation Bar -->
  <header class="navbar" style="border-bottom: 1.5px solid var(--accent-blue);">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="/admin" class="nav-brand">
        <div class="brand-icon" style="background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));">⚙️</div>
        <span>AptiRise <span style="font-weight: 400; font-size: 0.88rem; color: var(--accent-blue);">Admin</span></span>
      </a>

      <nav class="nav-links">
        <a href="/admin" class="nav-item {% if request.url.path == '/admin' or request.url.path == '/admin/' %}active{% endif %}">Dashboard</a>
        <a href="/admin/questions" class="nav-item {% if '/admin/questions' in request.url.path %}active{% endif %}">Questions</a>
        <a href="/admin/pdf/import" class="nav-item {% if '/admin/pdf' in request.url.path %}active{% endif %}">PDF Import & AI</a>
        <a href="/admin/settings" class="nav-item {% if '/admin/settings' in request.url.path %}active{% endif %}">Settings</a>
        <a href="/admin/audit-logs" class="nav-item {% if '/admin/audit-logs' in request.url.path %}active{% endif %}">Audit Logs</a>
      </nav>
    </div>

    <div class="nav-actions">
      <!-- Theme Switcher -->
      <button class="btn btn-secondary btn-icon" id="themeToggleBtn" aria-label="Toggle Theme" title="Toggle Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg>
      </button>

      <a href="/dashboard" class="btn btn-secondary" style="font-size: 0.85rem;">
        🎮 Game App
      </a>

      <div class="badge badge-purple" style="font-size: 0.82rem;">
        {{ admin.username }}
      </div>

      <a href="/logout" class="btn btn-ghost" style="font-size: 0.85rem;">Logout</a>
    </div>
  </header>

  <main class="container" style="max-width: 1200px;">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
