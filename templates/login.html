{% extends "base.html" %}

{% block title %}Sign In — AptiRise{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto; width: 100%;">
  <div class="card" style="box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.25rem;">▲</div>
      <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.35rem;">
        Sign in to AptiRise
      </h1>
      <p style="font-size: 0.92rem; color: var(--text-secondary);">
        Continue your aptitude progression journey
      </p>
    </div>

    <!-- Google OAuth Button -->
    <a href="/auth/google" class="btn btn-secondary" style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; justify-content: center;" id="googleSignInBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.9c2.28-2.1 3.64-5.2 3.64-9.15z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.9-3.05c-1.08.72-2.45 1.16-4.03 1.16-3.1 0-5.74-2.1-6.68-4.92H1.26v3.15C3.25 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.32 14.28c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28V6.57H1.26A11.95 11.95 0 0 0 0 12c0 1.92.45 3.74 1.26 5.43l4.06-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.64 1.26 6.57l4.06 3.15c.94-2.82 3.58-4.97 6.68-4.97z"/></svg>
      <span>Continue with Google</span>
    </a>

    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; color: var(--text-tertiary); font-size: 0.82rem;">
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      <span>or sign in with email</span>
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
    </div>

    <!-- Error Alert Box -->
    <div id="loginErrorAlert" class="badge badge-rose" style="display: none; width: 100%; padding: 0.6rem; margin-bottom: 1.25rem; font-size: 0.85rem; text-align: center; justify-content: center;"></div>

    <!-- Email/Password Form -->
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" required class="form-input" placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required class="form-input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;" id="loginSubmitBtn">
        Sign In →
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
      Don't have an account? <a href="/register" style="color: var(--accent-blue); font-weight: 600;">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errAlert = document.getElementById("loginErrorAlert");

    errAlert.style.display = "none";

    try {
      const resp = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await resp.json();
      if (!resp.ok) {
        errAlert.textContent = data.detail || "Invalid login credentials";
        errAlert.style.display = "flex";
      } else {
        if (data.user && data.user.role === "admin") {
          window.location.href = "/admin";
        } else {
          window.location.href = "/dashboard";
        }
      }
    } catch (err) {
      errAlert.textContent = "Unable to connect to server. Please try again.";
      errAlert.style.display = "flex";
    }
  });
</script>
{% endblock %}
